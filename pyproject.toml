[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "get-trust-anchor"
version = "0.3"
description = "DNSSEC Trust Anchor Tools"
requires-python = ">=3.10"
license = "BSD-2-Clause"
dependencies = [
    "cryptography>=41.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
]

[project.urls]
Repository = "https://github.com/iana-org/get-trust-anchor/"

[project.optional-dependencies]
dev = ["ruff>=0.4", "ty>=0.0.1a7", "pytest>=7"]
test = ["pytest>=7"]

[project.scripts]
get-trust-anchor = "get_trust_anchor.cli:main"

[tool.setuptools.packages.find]
include = ["get_trust_anchor"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ty.environment]
python-platform = "all"

[tool.ty.rules]
# Third-party imports (cryptography, pytest) may not be resolvable in all
# environments — these are checked at runtime and during CI installation.
unresolved-import = "ignore"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "S",      # flake8-bandit (security)
]
ignore = [
    "E722",   # bare-except (pre-existing style, not changing in this pass)
    "S310",   # suspicious-url-open-usage (intentional URL fetching)
    "S324",   # sha1 usage (required by DNSSEC DS digest type 1)
    "SIM115", # context-manager for open (not warranted in all cases here)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S603"]  # assert and subprocess calls are expected in tests
